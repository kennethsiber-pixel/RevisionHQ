<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061019">
<meta name="revisionhq-build" content="10-preview-repair-5min-visible">
<title>Revision HQ — Lucas</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061019}#rhq{display:block;width:100%;height:100%;border:0;background:#061019}</style>
</head>
<body>
<iframe id="rhq" src="./core.html?v=8000" title="Revision HQ"></iframe>
<script>
const frame=document.getElementById('rhq');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;if(!d)return;
  if(!d.querySelector('link[data-mission-layer]')){const l=d.createElement('link');l.rel='stylesheet';l.href='./mission.css?v=1010';l.dataset.missionLayer='1';d.head.appendChild(l)}
  if(!d.querySelector('script[data-mission-layer]')){
    const s=d.createElement('script');s.src='./mission.js?v=1014';s.async=false;s.dataset.missionLayer='1';
    s.onload=()=>{
      const energy=d.querySelector('.energy-block');
      if(energy&&!d.querySelector('#justStartMission')){
        const style=d.createElement('style');
        style.textContent='.just-start-mission{width:100%;margin:8px 0 7px;min-height:42px;border:1px solid rgba(216,170,83,.58);border-radius:6px;background:linear-gradient(180deg,rgba(216,170,83,.15),rgba(7,23,32,.94));color:#f1dfb9;padding:8px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}.just-start-mission span{font:400 12px var(--serif);letter-spacing:.01em}.just-start-mission b{font:400 17px var(--serif);color:#f1ce7b}.just-start-mission:hover{border-color:#d8aa53;background:linear-gradient(180deg,rgba(216,170,83,.22),rgba(7,23,32,.96))}';
        d.head.appendChild(style);
        const btn=d.createElement('button');btn.id='justStartMission';btn.className='just-start-mission';btn.type='button';btn.innerHTML='<span>Just give me something</span><b>5m</b>';
        const choices=energy.querySelector('.mission-buttons');
        if(choices)energy.insertBefore(btn,choices);else energy.appendChild(btn);
        btn.addEventListener('click',()=>d.querySelector('#tinyMission')?.click());
      }
    };
    d.body.appendChild(s)
  }
});
</script>
</body>
</html>
