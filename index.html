<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061019">
<meta name="revisionhq-build" content="10-ai-feedback-preview">
<title>Revision HQ — Lucas</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061019}#rhq{display:block;width:100%;height:100%;border:0;background:#061019}</style>
</head>
<body>
<iframe id="rhq" src="./core.html?v=8000" title="Revision HQ"></iframe>
<script>
const frame=document.getElementById('rhq');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;if(!d)return;
  const w=d.defaultView;
  if(location.hostname.includes('githack.com')||location.hostname.includes('rawcdn.githack.com')){
    w.REVISIONHQ_AI_ENDPOINT='https://revisionhq-git-b10ai-kennethsiber-1206.vercel.app/api/assess';
  } else {
    w.REVISIONHQ_AI_ENDPOINT='/api/assess';
  }
  if(!d.querySelector('link[data-mission-layer]')){
    const l=d.createElement('link');l.rel='stylesheet';l.href='./mission.css?v=1010';l.dataset.missionLayer='1';d.head.appendChild(l)
  }
  if(!d.querySelector('script[data-mission-layer]')){
    const s=d.createElement('script');s.src='./mission.js?v=1014';s.async=false;s.dataset.missionLayer='1';
    s.onload=()=>{
      if(d.querySelector('script[data-mission-evaluator]'))return;
      const e=d.createElement('script');e.src='./mission-evaluator.js?v=1030';e.async=false;e.dataset.missionEvaluator='1';d.body.appendChild(e)
    };
    d.body.appendChild(s)
  }
});
</script>
</body>
</html>
